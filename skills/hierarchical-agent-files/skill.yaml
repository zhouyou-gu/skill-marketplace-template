id: hierarchical-agent-files
name: Hierarchical Agent File Scaffold
description: Scaffold a two-level parent + children agent-file hierarchy in one shot. Delegates per-node base scaffolding to agent-files and installs immutable child control files plus hierarchy-specific non-AGENT.md clauses (outer-boundary constraint, progress-scope rule, deferred parent ledger seed) so every node is internally consistent on first read.
category: devtools
tags:
  - agents
  - scaffolding
  - hierarchy
  - nested-workspaces
  - templates
difficulty: intermediate
repo: https://github.com/zhouyou-gu/skill-marketplace-template
install:
  pip: jinja2
agent:
  protocol: mcp
  tool_schema: tool.json
parents:
  - agent-files
